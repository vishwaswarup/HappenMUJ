# Single-node replica set: required for multi-document transactions.
services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Healthy only once the replica set has a primary.
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.hello().isWritablePrimary ? 0 : quit(1)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  # One-shot init step: rs.initiate() (idempotent).
  mongo-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_started
    restart: "no"
    entrypoint:
      - mongosh
      - --host
      - mongo:27017
      - --quiet
      - --eval
      - |
        try { rs.status() } catch (e) {
          rs.initiate({_id: "rs0", members: [{_id: 0, host: "localhost:27017"}]})
        }

volumes:
  mongo-data:
