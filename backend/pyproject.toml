[project]
name = "happenmuj"
version = "0.1.0"
description = "HappenMUJ backend: campus event discovery on MongoDB"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pymongo>=4.13",
    "argon2-cffi>=23.1",
    "PyJWT>=2.9",
    "python-multipart>=0.0.9",
    "email-validator>=2.2",
    "Pillow>=10.4",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.6"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "UP046"]  # B008: FastAPI Depends() defaults; UP046: keep Generic[T] for pydantic

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
